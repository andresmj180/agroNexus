<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>agroNexus</title>
  <link rel="icon" href="/icon">
  <style>
    :root {
      --avellana: #E8DCC4;
      --crema: #F3EBDD;
      --olive: #6E6B47;
      --barra: #4A3728;
      --texto-oscuro: #4A3728;
      --texto-claro: #FFFFFF;
      --error: #A8483C;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--crema);
      color: var(--texto-oscuro);
      display: flex;
      flex-direction: column;
    }
    body.arrastrando::after {
      content: "Suelta los archivos aquí";
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(74, 55, 40, 0.55);
      color: var(--texto-claro);
      font-size: 1.25rem;
      z-index: 20;
      pointer-events: none;
    }
    header {
      background: var(--barra);
      color: var(--texto-claro);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.75rem 1.25rem;
    }
    header h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 600;
    }
    #btnNueva {
      background: var(--olive);
      color: var(--texto-claro);
      border: 0;
      border-radius: 6px;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      font: inherit;
    }
    #btnNueva:hover { filter: brightness(1.08); }
    #btnNueva:disabled { opacity: 0.6; cursor: default; }
    #mensajes {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .msg {
      max-width: min(72ch, 92%);
      padding: 0.7rem 0.95rem;
      border-radius: 12px;
      line-height: 1.45;
    }
    .msg-usuario {
      align-self: flex-end;
      background: var(--olive);
      color: var(--texto-claro);
    }
    .msg-asistente {
      align-self: flex-start;
      background: var(--avellana);
      color: var(--texto-oscuro);
    }
    .msg-error {
      align-self: center;
      background: var(--error);
      color: var(--texto-claro);
    }
    .msg-files {
      margin-top: 0.4rem;
      font-size: 0.85rem;
      opacity: 0.9;
    }
    .msg-tools {
      margin: 0.5rem 0 0;
      padding: 0;
      list-style: none;
      font-size: 0.78rem;
      opacity: 0.75;
    }
    .pensando { display: inline-flex; gap: 4px; }
    .pensando i {
      width: 7px; height: 7px; border-radius: 50%;
      background: currentColor; opacity: 0.4;
      animation: pulso 1s infinite ease-in-out;
    }
    .pensando i:nth-child(2) { animation-delay: 0.15s; }
    .pensando i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes pulso {
      0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-3px); }
    }
    #adjuntosPreview {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      padding: 0 1.25rem 0.4rem;
    }
    #adjuntosPreview[hidden] { display: none; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--avellana);
      border-radius: 999px;
      padding: 0.2rem 0.55rem;
      font-size: 0.85rem;
    }
    .chip-x {
      border: 0;
      background: transparent;
      cursor: pointer;
      font: inherit;
      color: var(--texto-oscuro);
      line-height: 1;
    }
    #formulario {
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
      padding: 0.75rem 1.25rem 1rem;
      background: var(--avellana);
    }
    #entrada {
      flex: 1;
      resize: none;
      min-height: 2.6rem;
      max-height: 160px;
      padding: 0.55rem 0.75rem;
      border: 1px solid #cbbfa6;
      border-radius: 8px;
      font: inherit;
      color: var(--texto-oscuro);
      background: var(--crema);
    }
    #entrada:focus { outline: 2px solid var(--olive); outline-offset: 1px; }
    #btnAdjuntar, #btnEnviar {
      border: 0;
      border-radius: 8px;
      padding: 0.55rem 0.9rem;
      cursor: pointer;
      font: inherit;
      color: var(--texto-claro);
      background: var(--olive);
    }
    #btnEnviar { background: var(--barra); }
    #btnAdjuntar:hover, #btnEnviar:hover { filter: brightness(1.08); }
    #btnAdjuntar:disabled, #btnEnviar:disabled { opacity: 0.6; cursor: default; }
    #inputArchivos { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>agroNexus</h1>
    <button type="button" id="btnNueva">Nueva conversación</button>
  </header>
  <main id="mensajes" aria-live="polite"></main>
  <div id="adjuntosPreview" hidden></div>
  <form id="formulario">
    <input id="inputArchivos" type="file" multiple>
    <button type="button" id="btnAdjuntar" title="Adjuntar">＋</button>
    <textarea id="entrada" rows="1" placeholder="Escribe un mensaje…" autocomplete="off"></textarea>
    <button type="submit" id="btnEnviar">Enviar</button>
  </form>
  <script src="/static/app.js" defer></script>
</body>
</html>
