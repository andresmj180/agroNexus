<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agroNexus</title>
<link rel="icon" href="/icon">
<style>
  :root {
    --beige: #E8DCC4;
    --crema: #F3EBDD;
    --olive: #6E6B47;
    --barra: #4A3728;
    --texto: #4A3728;
    --blanco: #FFFFFF;
    --error: #A8483C;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, "Segoe UI", sans-serif;
    background: var(--crema);
    color: var(--texto);
    display: flex;
  }
  .sidebar {
    width: 250px;
    background: var(--olive);
    color: var(--blanco);
    display: flex;
    flex-direction: column;
    padding: 18px 14px;
    flex-shrink: 0;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
  }
  .brand img {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    object-fit: cover;
    background: var(--beige);
  }
  .brand h1 {
    font-size: 1.15rem;
    margin: 0;
    font-weight: 650;
  }
  .btn {
    border: 0;
    cursor: pointer;
    font: inherit;
    border-radius: 8px;
  }
  .btn-nueva {
    background: var(--barra);
    color: var(--blanco);
    padding: 10px 12px;
    width: 100%;
    font-weight: 600;
  }
  .btn-nueva:hover { filter: brightness(1.08); }
  .side-nota {
    margin-top: 16px;
    font-size: 0.82rem;
    line-height: 1.4;
    opacity: 0.9;
  }
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }
  header {
    background: var(--barra);
    color: var(--blanco);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  header strong { font-size: 1rem; }
  header span { font-size: 0.82rem; opacity: 0.85; }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 72%;
    padding: 10px 14px;
    border-radius: 10px;
    white-space: pre-wrap;
    word-wrap: break-word;
    line-height: 1.45;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--olive);
    color: var(--blanco);
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--beige);
    color: var(--texto);
  }
  .msg.error {
    align-self: center;
    background: var(--error);
    color: var(--blanco);
  }
  .tools {
    align-self: flex-start;
    font-size: 0.75rem;
    color: var(--olive);
    margin-top: -6px;
    margin-left: 4px;
  }
  .composer {
    padding: 12px 16px 16px;
    background: var(--beige);
    border-top: 1px solid #d4c6a8;
    flex-shrink: 0;
  }
  .previews {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }
  .chip {
    background: var(--crema);
    border: 1px solid #d4c6a8;
    border-radius: 999px;
    padding: 4px 8px 4px 10px;
    font-size: 0.78rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .chip button {
    border: 0;
    background: transparent;
    color: var(--error);
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
  }
  .row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  #adjuntar, #enviar {
    width: 42px;
    height: 42px;
    background: var(--olive);
    color: var(--blanco);
    flex-shrink: 0;
    font-size: 1.1rem;
  }
  #adjuntar:hover, #enviar:hover { filter: brightness(1.08); }
  #adjuntar:disabled, #enviar:disabled { opacity: 0.55; cursor: default; }
  textarea {
    flex: 1;
    resize: none;
    min-height: 42px;
    max-height: 140px;
    padding: 10px 12px;
    border: 1px solid #cbbfa6;
    border-radius: 8px;
    font: inherit;
    color: var(--texto);
    background: var(--blanco);
  }
  textarea:focus { outline: 2px solid var(--olive); border-color: var(--olive); }
  @media (max-width: 720px) {
    .sidebar { display: none; }
    .msg { max-width: 90%; }
  }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <img src="/icon" alt="">
      <h1>agroNexus</h1>
    </div>
    <button class="btn btn-nueva" id="nueva" type="button">Nueva conversación</button>
    <p class="side-nota">Asistente local. Los cambios de código se aprueban en la terminal.</p>
  </aside>
  <div class="main">
    <header>
      <strong>agroNexus</strong>
      <span id="estado">Listo</span>
    </header>
    <div id="log"></div>
    <form class="composer" id="form">
      <div class="previews" id="previews"></div>
      <div class="row">
        <button class="btn" id="adjuntar" type="button" title="Adjuntar">+</button>
        <textarea id="texto" rows="1" placeholder="Escribe un mensaje…"></textarea>
        <button class="btn" id="enviar" type="submit" title="Enviar">➤</button>
      </div>
      <input id="archivos" type="file" multiple hidden>
    </form>
  </div>
<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const texto = document.getElementById("texto");
  const estado = document.getElementById("estado");
  const previews = document.getElementById("previews");
  const inputFiles = document.getElementById("archivos");
  let sid = crypto.randomUUID();
  let pendientes = [];
  let ocupado = false;

  function autoAltura() {
    texto.style.height = "auto";
    texto.style.height = Math.min(texto.scrollHeight, 140) + "px";
  }
  texto.addEventListener("input", autoAltura);

  function agregar(rol, contenido) {
    const div = document.createElement("div");
    div.className = "msg " + rol;
    div.textContent = contenido;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function agregarTools(lista) {
    if (!lista || !lista.length) return;
    const t = document.createElement("div");
    t.className = "tools";
    t.textContent = "Herramientas: " + lista.join(" · ");
    log.appendChild(t);
    log.scrollTop = log.scrollHeight;
  }

  function pintarPreviews() {
    previews.innerHTML = "";
    pendientes.forEach((p, i) => {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.append(p.name);
      const x = document.createElement("button");
      x.type = "button";
      x.textContent = "×";
      x.onclick = () => { pendientes.splice(i, 1); pintarPreviews(); };
      chip.appendChild(x);
      previews.appendChild(chip);
    });
  }

  function leerArchivo(file) {
    return new Promise((resolve, reject) => {
      if (file.size > 20 * 1024 * 1024) {
        reject(new Error(file.name + " supera 20 MB"));
        return;
      }
      const r = new FileReader();
      r.onload = () => resolve({ name: file.name, type: file.type, data: r.result });
      r.onerror = () => reject(new Error("No se pudo leer " + file.name));
      r.readAsDataURL(file);
    });
  }

  document.getElementById("adjuntar").onclick = () => inputFiles.click();
  inputFiles.onchange = async () => {
    try {
      for (const f of inputFiles.files) {
        if (pendientes.length >= 8) break;
        pendientes.push(await leerArchivo(f));
      }
      pintarPreviews();
    } catch (e) {
      agregar("error", e.message);
    }
    inputFiles.value = "";
  };

  document.getElementById("nueva").onclick = async () => {
    try {
      await fetch("/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session: sid }),
      });
    } catch (_) {}
    sid = crypto.randomUUID();
    log.innerHTML = "";
    pendientes = [];
    pintarPreviews();
    agregar("bot", "Nueva conversación. ¿En qué te ayudo?");
    estado.textContent = "Listo";
    texto.focus();
  };

  texto.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter" && !ev.shiftKey) {
      ev.preventDefault();
      form.requestSubmit();
    }
  });

  form.onsubmit = async (ev) => {
    ev.preventDefault();
    const message = texto.value.trim();
    if (ocupado || (!message && !pendientes.length)) return;
    ocupado = true;
    document.getElementById("enviar").disabled = true;
    document.getElementById("adjuntar").disabled = true;
    estado.textContent = "Pensando…";
    if (message) agregar("user", message);
    else agregar("user", "(archivo adjunto)");
    const attachments = pendientes.slice();
    pendientes = [];
    pintarPreviews();
    texto.value = "";
    autoAltura();
    try {
      const r = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session: sid, message, attachments }),
      });
      const data = await r.json();
      if (!r.ok || data.error) throw new Error(data.error || "Error del servidor");
      agregar("bot", data.reply || "");
      agregarTools(data.tools);
    } catch (e) {
      agregar("error", e.message || String(e));
    } finally {
      ocupado = false;
      document.getElementById("enviar").disabled = false;
      document.getElementById("adjuntar").disabled = false;
      estado.textContent = "Listo";
      texto.focus();
    }
  };

  agregar("bot", "Hola, soy agroNexus. ¿En qué te ayudo?");
  texto.focus();
</script>
</body>
</html>
